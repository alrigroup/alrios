<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em Manutenção | ALRI GROUP</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://cdn.alrigroup.com/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://cdn.alrigroup.com/favicon-16x16.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
    --bg: #020202;
    --surface: rgba(17, 17, 17, 0.4);
    --border: rgba(255, 255, 255, 0.08);
    --text-main: #ffffff;
    --text-muted: #a0a0a0;
    --neon-red: #ff003c;
    --neon-red-glow: rgba(255, 0, 60, 0.5);
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: var(--font-sans);
    line-height: 1.6;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.navbar {
    padding: 1.5rem 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: rgba(2, 2, 2, 0.6);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; }
.logo span { color: var(--text-muted); font-weight: 400; }
#hero {
    position: relative;
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 2rem;
}
.bg-grid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 50px 50px;
    opacity: 0.2;
    z-index: 1;
}
.glow-orb {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 350px; height: 350px;
    background: radial-gradient(circle, var(--neon-red-glow) 0%, transparent 70%);
    z-index: 2;
    pointer-events: none;
    animation: pulse 4s infinite alternate ease-in-out;
}
@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
    100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
}
.hero-content {
    position: relative;
    z-index: 3;
    max-width: 650px;
}
.text-gradient {
    background: linear-gradient(90deg, var(--text-main) 0%, var(--neon-red) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px var(--neon-red-glow);
}
.hero-content h1 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 900;
    letter-spacing: -1px;
    margin-bottom: 1rem;
}
.hero-content p {
    color: var(--text-muted);
    font-size: 1.1rem;
    margin-bottom: 2rem;
}
.cta-button {
    display: inline-block;
    background: var(--neon-red);
    color: #fff;
    padding: 0.8rem 2rem;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px var(--neon-red-glow);
}
.cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px var(--neon-red);
}
footer {
    padding: 2rem 5%;
    border-top: 1px solid var(--border);
    text-align: center;
    background: #000000;
}
.footer-socials { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1rem; }
.footer-socials a { color: var(--text-muted); font-size: 1.2rem; transition: color 0.3s ease; }
.footer-socials a:hover { color: var(--neon-red); }
.footer-quote { color: var(--text-muted); font-size: 0.85rem; font-style: italic; margin-bottom: 0.5rem; }
.footer-copy { color: rgba(255,255,255,0.3); font-size: 0.75rem; }
.fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
.fade-in.visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<nav class="navbar"><div class="logo">ALRI<span>GROUP</span></div></nav>
<main>
<section id="hero">
<div class="bg-grid"></div>
<div class="glow-orb"></div>
<div class="hero-content fade-in visible">
<img src="https://cdn.alrigroup.com/ALRI-SF-W.png" width="250" alt="ALRI Group Logo" style="margin-bottom:2rem;filter:drop-shadow(0 0 10px rgba(255,255,255,0.1))">
<h1><span class="text-gradient">EM MANUTENÇÃO</span></h1>
<p>O sistema está temporariamente indisponível para manutenção. Tente novamente mais tarde.</p>
<a href="/" class="cta-button">Voltar ao Início</a>
</div>
</section>
</main>
<footer>
<div class="footer-socials">
<a href="https://www.instagram.com/alrigroup" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
<a href="https://dsc.gg/alrigroup" target="_blank" title="Discord"><i class="fab fa-discord"></i></a>
<a href="https://github.com/alrigroup" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
</div>
<p class="footer-quote">"Building the future, one line of code at a time."</p>
<p class="footer-copy">&copy; 2020-2026 ALRI GROUP. All rights reserved.</p>
</footer>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var fade = document.querySelector('.fade-in');
    if (fade) fade.classList.add('visible');
});
</script>
</body>
</html>
