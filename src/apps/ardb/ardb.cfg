[server]
port=5432
bind=0.0.0.0
max_connections=1024

[backend]
host=127.0.0.1
port=5433
user=postgres
password=postgres
database=postgres

# ==============================================================================
# HTTP REST API Gateway (OPCIONAL / DEFAULT: DESATIVADO)
# ==============================================================================
[http_api]
enabled=yes
bind=127.0.0.1
port=5435
route_prefix=/api/v1/db
auth_required=yes
max_payload_bytes=1048576

# ==============================================================================
# Security Policies & Forensic Audit
# ==============================================================================
[security]
sql_firewall=enforce
ddl_shield=enforce
audit_log=storage/ardb/audit.log
crypto_hash_chain=sha256
