name: Build & Release Sovereign .arapp (Web / Node.js)

on:
  push:
    branches: [ "main", "beta-v0.2.0", "beta*" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Web .arapp & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ALRIOS core toolchain
        uses: actions/checkout@v4
        with:
          repository: alrigroup/alrios
          path: alrios
          ref: beta-v0.2.0

      - name: Checkout ARWE Web Runtime
        run: |
          git clone --depth 1 https://github.com/alrigroup/arwe.git alrios/src/apps/arwe

      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: alrios/src/apps/${{ github.event.repository.name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies & compile ALRIOS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc make libssl-dev pkg-config
          cd alrios
          cmake -S . -B build-tools -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tools --target arkernel armake arwe_build -j$(nproc)
          chmod +x arcore/armake arcore/arcore arcore/arwe 2>/dev/null || true

      - name: Package into Sovereign .arapp
        run: |
          APP_NAME="${{ github.event.repository.name }}"
          echo "==> Empacotando app web ${APP_NAME}..."
          cd alrios
          ./arcore/armake build "src/apps/${APP_NAME}" "../${APP_NAME}.arapp"
          cd ..
          cp "${APP_NAME}.arapp" "${APP_NAME}-linux-x64.arapp"
          cp "${APP_NAME}.arapp" "${APP_NAME}-windows-x64.arapp"
          ls -lh *.arapp

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.01-beta' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.01-beta' }}
          files: |
            *.arapp
          generate_release_notes: false
          append_body: false
          body: |
            ### Sovereign Application Release

            - Binários soberanos para Linux x64 e Windows x64 (.arapp).
            - Pacote compilado e validado pela pipeline ALRIOS.
            - Compatibilidade com gerenciador `arpm`.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.01-beta' }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
