name: Build & Release Sovereign .arapp (Web / Node.js)

"on":
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Web .arapp & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout ALRIOS core toolchain
        uses: actions/checkout@v4
        with:
          repository: alrigroup/alrios
          path: alrios
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies & compile armake
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc make libssl-dev pkg-config
          cd alrios
          cmake -S . -B build-tools -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tools --target armake -j$(nproc)
          chmod +x arcore/armake

      - name: Build Web Application
        run: |
          cd app
          if [ -f "package.json" ]; then
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            if npm run | grep -q "build"; then
              npm run build
            fi
          fi

      - name: Package into Sovereign .arapp
        run: |
          APP_NAME=$(basename ${{ github.repository }})
          echo "==> Empacotando app web ${APP_NAME}..."
          ./alrios/arcore/armake build "app" "${APP_NAME}.arapp"
          ls -lh *.arapp

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Sovereign Web Build' }}
          files: |
            *.arapp
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
