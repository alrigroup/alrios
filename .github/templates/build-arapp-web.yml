name: Build & Release Sovereign .arapp (Web / Node.js)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Web .arapp & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ALRIOS core toolchain
        uses: actions/checkout@v4
        with:
          repository: alrigroup/alrios
          path: alrios
          ref: beta-v0.2

      - name: Checkout ARWN Web Runtime
        run: |
          git clone --depth 1 https://github.com/alrigroup/arwn.git alrios/src/apps/arwn

      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: alrios/src/apps/${{ github.event.repository.name }}

      - name: Extract App Version from arappmake
        id: meta
        run: |
          APP_VER=$(grep '"version"' alrios/src/apps/${{ github.event.repository.name }}/*.arappmake 2>/dev/null | head -n1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*//')
          if [ -z "$APP_VER" ]; then APP_VER="0.0.2"; fi
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT
          echo "tag=v${APP_VER}-beta" >> $GITHUB_OUTPUT
          echo "title=v${APP_VER}-beta" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies & compile ALRIOS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc make libssl-dev pkg-config
          cd alrios
          cmake -S . -B build-tools -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tools --target arkernel armake arwn_build -j$(nproc)
          chmod +x arcore/armake arcore/arcore arcore/arwn 2>/dev/null || true

      - name: Package into Sovereign .arapp
        run: |
          APP_NAME="${{ github.event.repository.name }}"
          echo "==> Empacotando app web ${APP_NAME}..."
          cd alrios
          ./arcore/armake build "src/apps/${APP_NAME}" "../${APP_NAME}.arapp"
          cd ..
          ls -lh *.arapp

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.meta.outputs.tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.meta.outputs.title }}
          files: |
            *.arapp
          generate_release_notes: true
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
