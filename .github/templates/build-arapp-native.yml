name: Build & Release Sovereign .arapp (Native)

on:
  push:
    branches: [ "main", "beta-v0.2.0", "beta*" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. BUILD LINUX .arapp (ELF)
  # ----------------------------------------------------------------------------
  build-linux:
    name: Build Linux .arapp (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ALRIOS core toolchain
        uses: actions/checkout@v4
        with:
          repository: alrigroup/alrios
          path: alrios
          ref: beta-v0.2.0

      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: alrios/src/apps/${{ github.event.repository.name }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc make libssl-dev pkg-config

      - name: Compile ALRIOS toolchain & arkernel
        run: |
          cd alrios
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target arkernel armake -j$(nproc)
          chmod +x arcore/armake

      - name: Compile and package native app into .arapp
        run: |
          APP_NAME="${{ github.event.repository.name }}"
          echo "==> Empacotando ${APP_NAME} para Linux..."
          cd alrios
          ./arcore/armake build "src/apps/${APP_NAME}" "../${APP_NAME}-linux-x64.arapp"
          cd ..
          ls -lh *-linux-x64.arapp

      - name: Upload Linux .arapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arapp
          path: "*-linux-x64.arapp"

  # ----------------------------------------------------------------------------
  # 2. BUILD WINDOWS .arapp (PE x64)
  # ----------------------------------------------------------------------------
  build-windows:
    name: Build Windows .arapp (x64)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Setup MSYS2 with MinGW GCC & OpenSSL
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-openssl mingw-w64-x86_64-ninja

      - name: Checkout ALRIOS core toolchain
        uses: actions/checkout@v4
        with:
          repository: alrigroup/alrios
          path: alrios
          ref: beta-v0.2.0

      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: alrios/src/apps/${{ github.event.repository.name }}

      - name: Compile ALRIOS toolchain on Windows
        shell: msys2 {0}
        run: |
          cd alrios
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win --target arkernel armake
          ls -la arcore

      - name: Compile and package native app into .arapp on Windows
        shell: msys2 {0}
        run: |
          APP_NAME="${{ github.event.repository.name }}"
          echo "==> Empacotando ${APP_NAME} para Windows..."
          cd alrios
          ./arcore/armake.exe build "src/apps/${APP_NAME}" "../${APP_NAME}-windows-x64.arapp"
          cd ..
          ls -lh *-windows-x64.arapp

      - name: Upload Windows .arapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arapp
          path: "*-windows-x64.arapp"

  # ----------------------------------------------------------------------------
  # 3. PUBLISH OFFICIAL GITHUB RELEASE
  # ----------------------------------------------------------------------------
  release:
    name: Publish Official .arapp Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Collect .arapp files
        run: |
          find . -name "*.arapp" -exec mv {} . \;
          ls -lh *.arapp

      - name: Publish Release with .arapp assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.0-beta' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.0-beta' }}
          files: |
            *.arapp
          generate_release_notes: false
          append_body: false
          body: |
            ### Sovereign Application Release

            - Binários soberanos para Linux x64 e Windows x64 (.arapp).
            - Pacote compilado e validado pela pipeline ALRIOS.
            - Compatibilidade com gerenciador `arpm`.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.0-beta' }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
