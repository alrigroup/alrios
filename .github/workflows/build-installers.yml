name: Build & Package Installers (Multi-OS)

"on":
  push:
    branches: [ "main", "beta-v0.2", "beta*" ]
    tags: [ "v*", "beta*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. LINUX BUILD & STANDALONE INSTALLER PACKAGING
  # ============================================================================
  build-linux:
    name: Linux x64 Standalone Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize available submodules
        run: |
          git submodule sync || true
          git submodule update --init --recursive || true

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc \
            make \
            libssl-dev \
            libgtk-3-dev \
            pkg-config \
            nodejs \
            npm

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release

      - name: Compile kernel, CLI, tools & master installer
        run: |
          cmake --build build-linux --target arcore alrios armake arinstall -j$(nproc)
          chmod +x arcore/arcore arcore/alrios arcore/armake arcore/arinstall 2>/dev/null || true
          ln -sf alrios arcore/arpm
          chmod +x arcore/arpm 2>/dev/null || true

      - name: Package modular .arapp applications
        run: |
          mkdir -p arcore/apps
          for appdir in src/apps/*/; do
            if [ -d "$appdir" ]; then
              appname=$(basename "$appdir")
              if [ -f "$appdir/${appname}.arappmake" ] || [ -f "$appdir/config.arwn" ] || [ -f "$appdir/CMakeLists.txt" ]; then
                echo "==> Empacotando app: ${appname}..."
                ./arcore/armake build "$appdir" "arcore/apps/${appname}.arapp" || {
                  echo "[AVISO] Falha ao empacotar ${appname}, continuando..."
                }
              fi
            fi
          done
          echo "==> Apps gerados:"
          ls -lh arcore/apps/

      - name: Assemble Linux Standalone Installer Executable
        run: |
          echo "==> Criando pacote de payload embutido..."
          python3 -c '
          import zipfile, os
          with zipfile.ZipFile("payload.zip", "w", zipfile.ZIP_STORED) as z:
              for root, dirs, files in os.walk("arcore"):
                  if ".staging" in root or "programfiles" in root: continue
                  for f in files:
                      if f == "arinstall": continue
                      p = os.path.join(root, f)
                      z.write(p, p)
          '
          cat arcore/arinstall payload.zip > alrios-installer-linux-x64
          chmod +x alrios-installer-linux-x64
          rm -f payload.zip
          echo "==> Instalador executavel unico do Linux gerado:"
          ls -lh alrios-installer-linux-x64

      - name: Upload Linux Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alrios-installer-linux-x64
          path: alrios-installer-linux-x64
          retention-days: 30

  # ============================================================================
  # 2. WINDOWS BUILD & STANDALONE SETUP EXECUTABLE
  # ============================================================================
  build-windows:
    name: Windows x64 Standalone Setup (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize available submodules
        shell: bash
        run: |
          git submodule sync || true
          git submodule update --init --recursive || true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate OpenSSL & Build with CMake
        shell: cmd
        run: |
          set "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL"
          if not exist "%OPENSSL_ROOT_DIR%" set "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64"
          if not exist "%OPENSSL_ROOT_DIR%" (
            choco install openssl.light -y
            set "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL"
          )
          echo OpenSSL located at: %OPENSSL_ROOT_DIR%
          cmake -S . -B build-win -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="%OPENSSL_ROOT_DIR%"
          cmake --build build-win --config Release --target arcore alrios armake arinstall

      - name: Package modular .arapp applications
        shell: bash
        run: |
          mkdir -p arcore/apps
          for appdir in src/apps/*/; do
            if [ -d "$appdir" ]; then
              appname=$(basename "$appdir")
              if [ -f "$appdir/${appname}.arappmake" ] || [ -f "$appdir/config.arwn" ] || [ -f "$appdir/CMakeLists.txt" ]; then
                echo "==> Empacotando app: ${appname}..."
                ./arcore/armake.exe build "$appdir" "arcore/apps/${appname}.arapp" || {
                  echo "[AVISO] Falha ao empacotar ${appname}, continuando..."
                }
              fi
            fi
          done
          echo "==> Apps gerados no Windows:"
          ls -lh arcore/apps/

      - name: Assemble Windows Standalone Setup Executable (.exe)
        shell: bash
        run: |
          # Copiar DLLs de runtime do OpenSSL para arcore/
          for p in "C:/Program Files/OpenSSL/bin" "C:/Program Files/OpenSSL-Win64/bin"; do
            if [ -d "$p" ]; then
              cp "$p"/*.dll arcore/ 2>/dev/null || true
            fi
          done
          
          echo "==> Empacotando payload embutido do Windows..."
          python -c '
          import zipfile, os
          with zipfile.ZipFile("payload.zip", "w", zipfile.ZIP_STORED) as z:
              for root, dirs, files in os.walk("arcore"):
                  if ".staging" in root or "programfiles" in root: continue
                  for f in files:
                      if f == "arinstall.exe": continue
                      p = os.path.join(root, f)
                      z.write(p, p)
          '
          cat arcore/arinstall.exe payload.zip > alrios-setup.exe
          rm -f payload.zip
          echo "==> Executavel alrios-setup.exe gerado com sucesso:"
          ls -lh alrios-setup.exe

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alrios-setup.exe
          path: alrios-setup.exe
          retention-days: 30

  # ============================================================================
  # 3. PUBLISH GITHUB RELEASE (Triggered on Tags or beta-v0.2 branch)
  # ============================================================================
  release:
    name: Publish Official Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/beta-v0.2'
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux installer artifact
        uses: actions/download-artifact@v4
        with:
          name: alrios-installer-linux-x64

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: alrios-setup.exe

      - name: Create GitHub Release with Standalone Installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.0-beta' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ALRIOS v0.2.0 Beta' }}
          files: |
            alrios-installer-linux-x64
            alrios-setup.exe
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
