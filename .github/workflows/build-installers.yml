name: Build & Package Installer (Linux)

"on":
  push:
    branches: [ "main", "release/**", "beta*" ]
    tags: [ "v*", "beta*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x64 Standalone Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize available submodules
        run: |
          git submodule sync || true
          git submodule update --init --recursive || true

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc \
            make \
            libssl-dev \
            libgtk-3-dev \
            pkg-config \
            nodejs \
            npm

      - name: Configure CMake (Release)
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release

      - name: Compile kernel, CLI, tools and installer
        run: |
          cmake --build build-linux --target arcore alrios armake arinstall -j$(nproc)
          chmod +x arcore/arcore arcore/alrios arcore/armake arcore/arinstall 2>/dev/null || true
          ln -sf alrios arcore/arpm
          chmod +x arcore/arpm 2>/dev/null || true

      - name: Package modular applications
        run: |
          mkdir -p arcore/apps
          for appdir in src/apps/*/; do
            if [ -d "$appdir" ]; then
              appname=$(basename "$appdir")
              if [ -f "$appdir/${appname}.arappmake" ] || [ -f "$appdir/config.arwe" ] || [ -f "$appdir/CMakeLists.txt" ]; then
                echo "==> Empacotando app: ${appname}..."
                ./arcore/armake build "$appdir" "arcore/apps/${appname}.arapp" || {
                  echo "[AVISO] Falha ao empacotar ${appname}, continuando..."
                }
              fi
            fi
          done
          echo "==> Apps gerados:"
          ls -lh arcore/apps/

      - name: Assemble Linux standalone installer
        run: |
          python3 -c '
          import os
          import zipfile
          with zipfile.ZipFile("payload.zip", "w", zipfile.ZIP_STORED) as archive:
              for root, dirs, files in os.walk("arcore"):
                  if ".staging" in root or "programfiles" in root:
                      continue
                  for filename in files:
                      if filename == "arinstall":
                          continue
                      path = os.path.join(root, filename)
                      archive.write(path, path)
          '
          cat arcore/arinstall payload.zip > alrios-installer-linux-x64
          chmod +x alrios-installer-linux-x64
          rm -f payload.zip
          ls -lh alrios-installer-linux-x64

      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: alrios-installer-linux-x64
          path: alrios-installer-linux-x64
          retention-days: 30

  release:
    name: Publish Linux Preview Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux installer artifact
        uses: actions/download-artifact@v4
        with:
          name: alrios-installer-linux-x64

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ALRIOS ${{ github.ref_name }} — Linux Preview
          files: alrios-installer-linux-x64
          generate_release_notes: false
          append_body: false
          body: |
            ### ALRIOS ${{ github.ref_name }} — Linux x64 Preview

            Release de campo anterior à v1.0, publicada temporariamente apenas para Linux x64.

            - Inclui instalador standalone Linux x64.
            - Build e empacotamento Linux validados pela pipeline desta tag.
            - Windows não integra esta publicação e permanece pendente de correções de portabilidade e validação nativa.
            - A suíte automatizada não equivale à execução individual de todos os planos adversariais documentados.

            **Full Changelog**: https://github.com/alrigroup/alrios/compare/v0.9.2...${{ github.ref_name }}
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
