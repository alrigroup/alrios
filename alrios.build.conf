# ==============================================================================
# ALRIOS Master Build & Runtime Profile Configuration
# ==============================================================================

# 1. EXECUTION PROFILE
# Options: enterprise | edge | sovereign
#   - enterprise: Production profile with strict sandbox and signatures (Default)
#   - edge: Performance-oriented sandbox with flexible DevMode
#   - sovereign: Sovereign-Max hardened mode with mandatory PQC
ALRIOS_PROFILE=enterprise

# 2. PKI TRUST LEVEL (Flexible Certificate Authority Chain)
# Options: root | intermediate | leaf
#   - root: Requires ONLY 'root.cert'. Root CA directly verifies package signatures.
#   - intermediate: Requires 'root.cert' + 'intermediate.cert'. Intermediate verifies signatures.
#   - leaf: Full 3-level chain ('root.cert' + 'intermediate.cert' + 'leaf.cert').
ALRIOS_TRUST_LEVEL=leaf

# 3. TRUST STORE DIRECTORY (Relative to arcore or absolute path)
ALRIOS_TRUST_DIR=arcore/trust

# 4. POST-QUANTUM CRYPTOGRAPHY (PQC - FIPS 204 ML-DSA-65 & FIPS 203 ML-KEM-768)
# Options: 1 (Enabled if available in crypto provider) | 0 (Disabled)
ALRIOS_ENABLE_PQC=1
